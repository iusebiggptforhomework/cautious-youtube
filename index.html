<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Signal — a quieter way to watch</title>
<meta name="description" content="A minimal, ad-free YouTube viewer with local history, real subscriptions, and a TV-friendly layout.">

<!-- ============================================================
     SIGNAL — single-file YouTube client
     Fonts: Archivo (display) / Inter (body) / JetBrains Mono (data)
     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* =========================================================
   DESIGN TOKENS
   ========================================================= */
:root{
  /* -- dark (default) stage -- */
  --bg:            #0B0D10;
  --bg-raised:     #14171C;
  --bg-raised-2:   #1B1F26;
  --border:        #262B33;
  --border-soft:   #1E222A;
  --text:          #EDEBE6;
  --text-dim:      #9AA0AC;
  --text-faint:    #5C6270;

  --accent:        #F2A93B;   /* signal amber — tally light, primary actions */
  --accent-dim:    #7A5A22;
  --accent-ink:    #241A05;   /* text-on-accent */

  --live:          #3FC1C9;   /* cold cyan — marks REAL api data */
  --live-dim:      #1F4D50;

  --danger:        #E5484D;
  --danger-dim:    #4A1E20;
  --ok:            #4FBF6B;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;

  --font-display: 'Archivo', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  --density-gap: 20px;
  --density-pad: 16px;
  --shadow-pop: 0 20px 60px -20px rgba(0,0,0,0.6);
  color-scheme: dark;
}

/* -- light theme override -- */
:root[data-theme="light"]{
  --bg:            #F7F5F0;
  --bg-raised:     #FFFFFF;
  --bg-raised-2:   #EFECE4;
  --border:        #DEDAD0;
  --border-soft:   #E8E4DA;
  --text:          #1B1B18;
  --text-dim:      #5C5A52;
  --text-faint:    #948F82;

  --accent:        #C97A1C;
  --accent-dim:    #F0D2A4;
  --accent-ink:    #FFF8EE;

  --live:          #0E8A91;
  --live-dim:      #CFEFEF;

  --danger:        #C4373C;
  --danger-dim:    #F6D6D6;
  --ok:            #2F9450;
  --shadow-pop: 0 20px 60px -20px rgba(0,0,0,0.18);
  color-scheme: light;
}

/* -- density variants -- */
:root[data-density="cozy"]{ --density-gap: 26px; --density-pad: 20px; }
:root[data-density="compact"]{ --density-gap: 12px; --density-pad: 10px; }

*,*::before,*::after{ box-sizing: border-box; }
html,body{ height:100%; }
body{
  margin:0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  transition: background .25s ease, color .25s ease;
}
img{ max-width:100%; display:block; }
button, input, select, textarea{ font-family: inherit; color: inherit; }
a{ color:inherit; text-decoration:none; }
::selection{ background: var(--accent); color: var(--accent-ink); }

::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background: transparent; }
::-webkit-scrollbar-thumb{ background: var(--border); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover{ background: var(--text-faint); }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* focus visibility - required for TV/keyboard nav */
:focus-visible{
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}
[data-tv-mode="true"] .tv-focusable:focus{
  outline: 3px solid var(--accent);
  outline-offset: 3px;
  transform: scale(1.03);
  z-index: 5;
  box-shadow: var(--shadow-pop);
}

/* =========================================================
   SHELL / TOPBAR
   ========================================================= */
.shell{ min-height:100%; display:flex; flex-direction:column; }

.topbar{
  position: sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:18px;
  padding: 12px 24px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border-soft);
}
.brand{
  display:flex; align-items:center; gap:9px;
  font-family: var(--font-display); font-weight:800; font-size:19px;
  letter-spacing: -0.01em;
  white-space:nowrap;
  cursor:pointer; background:none; border:none; padding:4px;
}
.brand .tally{
  width:11px; height:11px; border-radius:50%;
  background: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
}
.brand small{ font-family: var(--font-mono); font-weight:400; font-size:11px; color: var(--text-faint); letter-spacing:0; margin-left:2px; }

.nav-pills{ display:flex; gap:4px; }
.nav-pill{
  font-family: var(--font-display); font-weight:600; font-size:14px;
  padding: 8px 14px; border-radius: 999px; border:none;
  background: transparent; color: var(--text-dim); cursor:pointer;
  transition: background .15s, color .15s;
}
.nav-pill:hover{ background: var(--bg-raised); color: var(--text); }
.nav-pill[aria-current="true"]{ background: var(--bg-raised-2); color: var(--text); }

.search-form{
  flex:1; max-width: 620px; margin: 0 auto;
  display:flex; align-items:center; gap:8px;
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 8px 8px 8px 18px;
}
.search-form:focus-within{ border-color: var(--accent); }
.search-form input{
  flex:1; background:none; border:none; outline:none;
  font-size:14px; color:var(--text);
}
.search-form input::placeholder{ color: var(--text-faint); }
.search-form button{
  display:flex; align-items:center; justify-content:center;
  width:34px; height:34px; border-radius:50%;
  background: var(--accent); color: var(--accent-ink); border:none; cursor:pointer;
  flex-shrink:0;
}
.search-form button:hover{ filter:brightness(1.08); }

.topbar-actions{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
.icon-btn{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--border);
  background: var(--bg-raised); color: var(--text-dim); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition: border-color .15s, color .15s;
}
.icon-btn:hover{ color: var(--text); border-color: var(--text-faint); }
.icon-btn svg{ width:18px; height:18px; }

.avatar-btn{
  width:38px; height:38px; border-radius:50%; border:2px solid var(--border);
  overflow:hidden; cursor:pointer; background: var(--bg-raised); flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-family: var(--font-display); font-weight:700; font-size:13px;
}
.avatar-btn img{ width:100%; height:100%; object-fit:cover; }

.signin-btn{
  display:flex; align-items:center; gap:8px;
  padding: 8px 16px; border-radius: 999px;
  background: var(--accent); color: var(--accent-ink); border:none; cursor:pointer;
  font-family: var(--font-display); font-weight:700; font-size:13.5px;
  white-space:nowrap;
}
.signin-btn:hover{ filter:brightness(1.06); }

/* =========================================================
   PROVENANCE TALLY — signature element.
   A small colored dot + label marking whether data shown is
   REAL (live cyan, from Google/YouTube API) or LOCAL (amber,
   inferred from on-device activity). Used throughout.
   ========================================================= */
.tally-tag{
  display:inline-flex; align-items:center; gap:6px;
  font-family: var(--font-mono); font-size:10.5px; font-weight:500;
  letter-spacing:.03em; text-transform:uppercase;
  padding: 3px 8px 3px 6px; border-radius:999px;
  border:1px solid var(--border); color: var(--text-faint);
  white-space:nowrap;
}
.tally-tag .dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.tally-tag.is-live{ border-color: color-mix(in srgb, var(--live) 45%, var(--border)); color: var(--live); }
.tally-tag.is-live .dot{ background: var(--live); box-shadow: 0 0 0 2px color-mix(in srgb, var(--live) 20%, transparent); }
.tally-tag.is-local{ border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); color: var(--accent); }
.tally-tag.is-local .dot{ background: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 20%, transparent); }

/* =========================================================
   MAIN / VIEWS
   ========================================================= */
.view{ flex:1; padding: var(--density-pad) 24px 60px; max-width:1500px; margin:0 auto; width:100%; }
.view-header{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin: 18px 0 var(--density-gap); flex-wrap:wrap; }
.view-title{ font-family: var(--font-display); font-weight:800; font-size:26px; letter-spacing:-0.01em; display:flex; align-items:center; gap:12px; }
.view-sub{ color: var(--text-dim); font-size:13.5px; }

.chip-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom: var(--density-gap); }
.chip{
  padding:7px 14px; border-radius:999px; border:1px solid var(--border);
  background: var(--bg-raised); color: var(--text-dim); font-size:13px; font-weight:500;
  cursor:pointer; white-space:nowrap; transition: all .15s;
}
.chip:hover{ border-color: var(--text-faint); color:var(--text); }
.chip[aria-pressed="true"]{ background: var(--text); color: var(--bg); border-color: var(--text); }
:root[data-theme="light"] .chip[aria-pressed="true"]{ background: var(--text); color: var(--bg-raised); }

/* video grid */
.grid{
  display:grid; gap: var(--density-gap);
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
}
.card{
  cursor:pointer; border-radius: var(--radius-md); overflow:hidden;
  background:none; border:none; text-align:left; padding:0; color:var(--text);
  outline-offset: 4px;
}
.card-thumb-wrap{ position:relative; border-radius: var(--radius-md); overflow:hidden; background: var(--bg-raised); aspect-ratio: 16/9; }
.card-thumb-wrap img{ width:100%; height:100%; object-fit:cover; transition: transform .3s; }
.card:hover .card-thumb-wrap img{ transform: scale(1.04); }
.card-duration{
  position:absolute; right:6px; bottom:6px; background: rgba(0,0,0,.82); color:#fff;
  font-family: var(--font-mono); font-size:11px; padding:2px 6px; border-radius:4px;
}
.card-body{ display:flex; gap:10px; margin-top:10px; }
.card-ch-thumb{ width:36px; height:36px; border-radius:50%; overflow:hidden; background:var(--bg-raised-2); flex-shrink:0; }
.card-ch-thumb img{ width:100%; height:100%; object-fit:cover; }
.card-title{ font-size:14.5px; font-weight:600; line-height:1.35; margin-bottom:4px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.card-meta{ font-size:12.5px; color: var(--text-dim); line-height:1.5; }
.card-meta .dim{ color: var(--text-faint); }

.section-block{ margin-bottom:36px; }
.section-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; }
.section-head h2{ font-family: var(--font-display); font-size:18px; font-weight:700; display:flex; align-items:center; gap:10px; }

/* shorts rail */
.shorts-rail{ display:flex; gap:14px; overflow-x:auto; padding-bottom:6px; scroll-snap-type:x mandatory; }
.shorts-card{
  scroll-snap-align:start; flex-shrink:0; width:190px; aspect-ratio: 9/16;
  border-radius: var(--radius-lg); overflow:hidden; position:relative; cursor:pointer;
  background: var(--bg-raised); border:1px solid var(--border-soft);
}
.shorts-card img{ width:100%; height:100%; object-fit:cover; }
.shorts-card .shorts-title{
  position:absolute; left:0; right:0; bottom:0; padding:10px 10px 12px;
  background: linear-gradient(to top, rgba(0,0,0,.85), transparent);
  color:#fff; font-size:12.5px; font-weight:600; line-height:1.3;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
}
.shorts-badge{ position:absolute; top:8px; right:8px; background:rgba(0,0,0,.7); color:#fff; padding:3px 7px; border-radius:6px; font-size:10px; font-family:var(--font-mono); }

/* empty state */
.empty-state{
  text-align:center; padding: 70px 20px; color: var(--text-dim);
  border: 1px dashed var(--border); border-radius: var(--radius-lg);
}
.empty-state .empty-icon{ font-size:34px; margin-bottom:12px; }
.empty-state h3{ font-family: var(--font-display); color: var(--text); font-size:17px; margin: 0 0 6px; }
.empty-state p{ font-size:13.5px; max-width:420px; margin:0 auto; }
.empty-state .signin-btn{ margin-top:18px; display:inline-flex; }

/* =========================================================
   WATCH PAGE
   ========================================================= */
.watch-layout{ display:grid; grid-template-columns: minmax(0,1fr) 360px; gap:26px; align-items:start; }
.player-wrap{
  position:relative; width:100%; aspect-ratio:16/9; background:#000;
  border-radius: var(--radius-lg); overflow:hidden; box-shadow: var(--shadow-pop);
}
.player-wrap iframe{ width:100%; height:100%; border:none; }
.player-fallback{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:10px; color:var(--text-dim); background:#000; text-align:center; padding:20px;
}

.watch-title{ font-family:var(--font-display); font-size:21px; font-weight:700; margin:18px 0 10px; line-height:1.3; }
.watch-meta-row{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; margin-bottom:16px; }
.watch-stats{ color:var(--text-dim); font-size:13.5px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

.engage-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.pill-group{ display:flex; border:1px solid var(--border); border-radius:999px; overflow:hidden; }
.pill-group button{
  display:flex; align-items:center; gap:7px; padding:9px 16px; background:var(--bg-raised);
  border:none; cursor:pointer; font-weight:600; font-size:13.5px; color:var(--text);
}
.pill-group button:first-child{ border-right:1px solid var(--border); }
.pill-group button.active{ color: var(--accent); }
.pill-group button.active.dislike{ color: var(--danger); }
.pill-btn-plain{
  display:flex; align-items:center; gap:7px; padding:9px 16px; background:var(--bg-raised);
  border:1px solid var(--border); border-radius:999px; cursor:pointer; font-weight:600; font-size:13.5px;
}
.pill-btn-plain:hover{ border-color: var(--text-faint); }

.channel-row{ display:flex; align-items:center; gap:12px; padding: 16px 0; border-top:1px solid var(--border-soft); border-bottom:1px solid var(--border-soft); margin-bottom:20px; }
.channel-row img{ width:44px; height:44px; border-radius:50%; object-fit:cover; background:var(--bg-raised-2); }
.channel-row .ch-name{ font-weight:700; font-size:14.5px; }
.channel-row .ch-subs{ font-size:12.5px; color:var(--text-faint); }
.subscribe-btn{
  margin-left:auto; padding:9px 18px; border-radius:999px; border:none; cursor:pointer;
  background:var(--text); color:var(--bg); font-weight:700; font-size:13.5px;
}
:root[data-theme="light"] .subscribe-btn{ background:var(--text); color:#fff; }
.subscribe-btn.subscribed{ background: var(--bg-raised-2); color:var(--text-dim); border:1px solid var(--border); }

.desc-box{
  background: var(--bg-raised); border-radius: var(--radius-md); padding:14px 16px;
  font-size:13.5px; line-height:1.6; color:var(--text-dim); white-space:pre-wrap;
  max-height:110px; overflow:hidden; position:relative; cursor:pointer; margin-bottom:30px;
}
.desc-box.expanded{ max-height:none; }
.desc-box::after{
  content:"Show more"; position:absolute; bottom:0; right:0; left:0; text-align:right;
  padding: 24px 16px 8px; font-weight:700; color:var(--text);
  background: linear-gradient(to top, var(--bg-raised) 40%, transparent);
}
.desc-box.expanded::after{ display:none; }

/* comments */
.comments-head{ display:flex; align-items:center; gap:14px; margin-bottom:20px; font-weight:700; font-size:15.5px; }
.comment{ display:flex; gap:12px; margin-bottom:22px; }
.comment img{ width:38px; height:38px; border-radius:50%; flex-shrink:0; object-fit:cover; background:var(--bg-raised-2); }
.comment-body{ flex:1; min-width:0; }
.comment-head{ display:flex; align-items:center; gap:8px; font-size:12.5px; margin-bottom:4px; }
.comment-author{ font-weight:700; }
.comment-date{ color:var(--text-faint); }
.comment-text{ font-size:13.5px; line-height:1.55; margin-bottom:6px; word-wrap:break-word; }
.comment-actions{ display:flex; align-items:center; gap:14px; color:var(--text-faint); font-size:12px; }

.sidebar-list{ display:flex; flex-direction:column; gap:12px; }
.side-card{ display:flex; gap:10px; cursor:pointer; border-radius:var(--radius-sm); padding:4px; }
.side-card:hover{ background: var(--bg-raised); }
.side-thumb{ width:150px; flex-shrink:0; aspect-ratio:16/9; border-radius:var(--radius-sm); overflow:hidden; background:var(--bg-raised-2); position:relative; }
.side-thumb img{ width:100%; height:100%; object-fit:cover; }
.side-info .side-title{ font-size:13px; font-weight:600; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.side-info .side-meta{ font-size:11.5px; color:var(--text-faint); margin-top:5px; }

/* =========================================================
   SHORTS PLAYER VIEW
   ========================================================= */
.shorts-viewer{
  height: calc(100vh - 64px); display:flex; align-items:center; justify-content:center;
  scroll-snap-type: y mandatory; overflow-y:auto; gap:20px; flex-direction:column;
}
.shorts-stage{
  width:min(400px, 92vw); height:min(88vh, 780px); background:#000; border-radius:var(--radius-lg);
  overflow:hidden; position:relative; scroll-snap-align:center; flex-shrink:0; box-shadow:var(--shadow-pop);
}
.shorts-stage iframe{ width:100%; height:100%; border:none; }
.shorts-side-actions{ position:absolute; right:-56px; bottom:60px; display:flex; flex-direction:column; gap:18px; align-items:center; }
.shorts-side-actions button{ background:var(--bg-raised); border:1px solid var(--border); color:var(--text); width:44px; height:44px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.shorts-nav-hint{ color:var(--text-faint); font-size:12px; text-align:center; font-family:var(--font-mono); }

/* =========================================================
   SETTINGS PANEL (modal/drawer)
   ========================================================= */
.overlay{ position:fixed; inset:0; background: rgba(0,0,0,.5); z-index:90; backdrop-filter: blur(2px); }
.settings-panel{
  position:fixed; top:0; right:0; height:100%; width:min(440px, 100vw); z-index:95;
  background: var(--bg-raised); border-left:1px solid var(--border);
  display:flex; flex-direction:column; box-shadow: -20px 0 60px -20px rgba(0,0,0,.5);
  animation: slideIn .22s ease;
}
@keyframes slideIn{ from{ transform: translateX(24px); opacity:0; } to{ transform:none; opacity:1; } }
.settings-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--border-soft); }
.settings-head h2{ font-family:var(--font-display); font-size:19px; font-weight:800; }
.settings-body{ flex:1; overflow-y:auto; padding: 8px 20px 30px; }
.settings-section{ padding: 20px 0; border-bottom:1px solid var(--border-soft); }
.settings-section:last-child{ border-bottom:none; }
.settings-section h3{ font-family:var(--font-display); font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); margin-bottom:14px; }
.settings-row{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:10px 0; }
.settings-row .row-label{ font-size:14px; font-weight:600; }
.settings-row .row-hint{ font-size:12px; color:var(--text-faint); margin-top:2px; max-width:280px; }

.switch{ position:relative; width:44px; height:26px; flex-shrink:0; }
.switch input{ opacity:0; width:100%; height:100%; position:absolute; margin:0; cursor:pointer; z-index:1; }
.switch .track{ position:absolute; inset:0; background: var(--border); border-radius:999px; transition:.15s; }
.switch .thumb{ position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:.15s; box-shadow:0 1px 3px rgba(0,0,0,.3); }
.switch input:checked + .track{ background: var(--accent); }
.switch input:checked + .track .thumb{ transform: translateX(18px); }

.seg-control{ display:flex; background: var(--bg-raised-2); border-radius:10px; padding:3px; gap:2px; }
.seg-control button{ flex:1; border:none; background:none; padding:8px 10px; border-radius:8px; font-size:13px; font-weight:600; color:var(--text-dim); cursor:pointer; white-space:nowrap; }
.seg-control button.active{ background: var(--bg-raised); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.15); }

.select-input{
  background: var(--bg-raised-2); border:1px solid var(--border); border-radius:8px;
  padding:8px 10px; font-size:13px; font-weight:600; cursor:pointer; min-width:120px;
}

.theme-swatches{ display:flex; gap:10px; }
.swatch{ width:40px; height:40px; border-radius:50%; border:2px solid transparent; cursor:pointer; position:relative; flex-shrink:0; }
.swatch.active{ border-color: var(--text); }
.swatch.active::after{ content:"✓"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:15px; text-shadow: 0 1px 2px rgba(0,0,0,.5); color:#fff; }

.acc-swatches{ display:flex; gap:9px; flex-wrap:wrap; }
.acc-swatch{ width:28px; height:28px; border-radius:50%; cursor:pointer; border:2px solid transparent; }

<body>
<div id="app"></div>

<!-- Google Identity Services (for Sign in with Google) -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!-- YouTube IFrame API (for shorts + main player postMessage control) -->
<script src="https://www.youtube.com/iframe_api" async defer></script>

<script>
/* =====================================================================
   SIGNAL — single-file YouTube client
   Sections:
     1. CONFIG           — API keys / OAuth (edit these, see README view)
     2. STORE            — localStorage-backed state + settings
     3. API              — YouTube Data API v3 + Google OAuth wrapper
     4. UTIL             — formatters, helpers
     5. ROUTER / RENDER   — hash router + view renderer
     6. VIEWS            — home, watch, shorts, search, subs, playlists,
                            history, settings
     7. TV / KEYBOARD NAV
     8. INIT
   ===================================================================== */

(function(){
"use strict";

/* ---------------------------------------------------------------------
   1. CONFIG
   Fill these in before deploying. See the in-app "Setup" tab (Settings
   -> Setup & API Keys) for full step-by-step instructions — the same
   text is duplicated here as a code comment for convenience.

   - YT_API_KEY:  YouTube Data API v3 key (API key, not OAuth client).
                  Console -> APIs & Services -> Credentials -> Create
                  Credentials -> API key. Restrict it to "YouTube Data
                  API v3" and to your GitHub Pages HTTP referrer.
   - GOOGLE_CLIENT_ID: OAuth 2.0 Client ID (Web application type).
                  Console -> Credentials -> Create Credentials ->
                  OAuth client ID -> Web application. Add your GitHub
                  Pages origin (e.g. https://yourname.github.io) to
                  "Authorized JavaScript origins". No redirect URI
                  needed — this app uses Google Identity Services'
                  token model, which is popup-based.
   --------------------------------------------------------------------- */
const CONFIG = {
  YT_API_KEY: "AIzaSyDmb1XJWILuOY-CljetVf3IGid457s1fcw",
  GOOGLE_CLIENT_ID: "569276949928-u2jlqua1uq5nfepuv7ifd16o0fl9eksh.apps.googleusercontent.com",
  OAUTH_SCOPES: [
    "https://www.googleapis.com/auth/youtube.readonly"
  ].join(" ")
};

const IS_CONFIGURED = {
  apiKey: CONFIG.YT_API_KEY && !CONFIG.YT_API_KEY.startsWith("PASTE_"),
  oauth: CONFIG.GOOGLE_CLIENT_ID && !CONFIG.GOOGLE_CLIENT_ID.startsWith("PASTE_")
};

/* ---------------------------------------------------------------------
   2. STORE — all persistence lives in localStorage. Nothing here ever
   touches a server other than YouTube/Google's own APIs.
   --------------------------------------------------------------------- */
const LS_KEYS = {
  settings: "signal.settings.v1",
  history:  "signal.history.v1",      // [{videoId,title,channel,thumb,watchedAt,progressSec,durSec}]
  reactions:"signal.reactions.v1",    // {videoId: "like"|"dislike"}
  localDislikes: "signal.dislikeCounts.v1", // {videoId: n}  purely cosmetic/local
  authToken:"signal.auth.v1"          // {access_token, expiresAt, profile}
};

const DEFAULT_SETTINGS = {
  theme: "dark",          // dark | light | system
  accent: "#F2A93B",
  layout: "standard",     // standard | tv
  density: "cozy",        // cozy | compact
  autoplay: true,
  defaultQuality: "auto", // auto | 1080 | 720 | 480 | 360
  adShield: "embed",      // embed | embed+notice  (both routes use the clean IFrame embed; see note)
  showShorts: true,
  restrictedMode: false,
  playerCaptions: false,
  reduceMotion: false,
  historyEnabled: true,
  region: "US"
};

function loadJSON(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    if(!raw) return fallback;
    const parsed = JSON.parse(raw);
    return parsed == null ? fallback : parsed;
  }catch(e){ return fallback; }
}
function saveJSON(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ console.warn("storage full/blocked", e); }
}

const Store = {
  settings: Object.assign({}, DEFAULT_SETTINGS, loadJSON(LS_KEYS.settings, {})),
  history: loadJSON(LS_KEYS.history, []),
  reactions: loadJSON(LS_KEYS.reactions, {}),
  localDislikes: loadJSON(LS_KEYS.localDislikes, {}),
  auth: loadJSON(LS_KEYS.authToken, null),

  saveSettings(){ saveJSON(LS_KEYS.settings, this.settings); },
  saveHistory(){ saveJSON(LS_KEYS.history, this.history.slice(0, 500)); },
  saveReactions(){ saveJSON(LS_KEYS.reactions, this.reactions); },
  saveDislikes(){ saveJSON(LS_KEYS.localDislikes, this.localDislikes); },
  saveAuth(){ saveJSON(LS_KEYS.authToken, this.auth); },

  updateSetting(key, val){
    this.settings[key] = val;
    this.saveSettings();
    applySettingsToDOM();
  },

  addHistory(video){
    if(!this.settings.historyEnabled) return;
    this.history = this.history.filter(h => h.videoId !== video.videoId);
    this.history.unshift(Object.assign({ watchedAt: Date.now() }, video));
    this.saveHistory();
  },
  clearHistory(){ this.history = []; this.saveHistory(); },
  removeHistoryItem(videoId){
    this.history = this.history.filter(h => h.videoId !== videoId);
    this.saveHistory();
  },

  setReaction(videoId, type){
    const current = this.reactions[videoId];
    if(current === type){
      delete this.reactions[videoId]; // toggle off
    } else {
      this.reactions[videoId] = type;
    }
    this.saveReactions();
  },

  bumpLocalDislike(videoId){
    // Local-only counter (YouTube hid public dislike counts in Dec 2021).
    // We seed a stable pseudo-count per video so it doesn't look empty,
    // then increment/decrement on user toggle. Clearly tagged in UI.
    if(!(videoId in this.localDislikes)) this.localDislikes[videoId] = seedPseudoCount(videoId);
  },

  isSignedIn(){
    return !!(this.auth && this.auth.access_token && this.auth.expiresAt > Date.now());
  },
  signOut(){
    this.auth = null; this.saveAuth();
    try{ if(window.google && google.accounts && google.accounts.oauth2){ /* token revoke handled in API.signOut */ } }catch(e){}
  }
};

function seedPseudoCount(id){
  let h = 0;
  for(let i=0;i<id.length;i++){ h = (h*31 + id.charCodeAt(i)) >>> 0; }
  return h % 340;
}

/* ---------------------------------------------------------------------
   3. API — thin wrapper over YouTube Data API v3 (key-based, public
   reads) and Google Identity Services (OAuth token client, for
   signed-in personal data: subscriptions / playlists / liked videos).

   IMPORTANT: YouTube's Data API has never exposed a user's actual
   watch history (removed from the API surface years before v3 even
   shipped, for privacy reasons). There is no client-side workaround.
   "History" in this app = locally logged plays from Store.history,
   clearly tagged as LOCAL in the UI. Subscriptions / liked videos /
   playlists ARE real, live API data when signed in.
   --------------------------------------------------------------------- */
const API_BASE = "https://www.googleapis.com/youtube/v3";
let quotaUsedEstimate = 0; // rough cosmetic counter shown in settings, units are approximate

const Api = {
  tokenClient: null,
  gisReady: false,

  async ytFetch(path, params, useAuth){
    if(!IS_CONFIGURED.apiKey && !(useAuth && Store.isSignedIn())){
      throw new ApiError("NO_KEY", "No YouTube API key configured yet.");
    }
    const url = new URL(API_BASE + path);
    Object.entries(params||{}).forEach(([k,v])=>{ if(v!=null) url.searchParams.set(k,v); });
    if(IS_CONFIGURED.apiKey) url.searchParams.set("key", CONFIG.YT_API_KEY);

    const headers = {};
    if(useAuth && Store.isSignedIn()){ headers["Authorization"] = "Bearer " + Store.auth.access_token; }

    quotaUsedEstimate += 1;
    const res = await fetch(url.toString(), { headers });
    if(!res.ok){
      let body = null; try{ body = await res.json(); }catch(e){}
      const reason = body && body.error && body.error.errors && body.error.errors[0] && body.error.errors[0].reason;
      if(res.status === 403 && (reason==="quotaExceeded" || reason==="dailyLimitExceeded")){
        throw new ApiError("QUOTA", "Daily YouTube API quota has been used up. Try again after the quota resets (midnight Pacific time).");
      }
      if(res.status === 401){ throw new ApiError("AUTH", "Google session expired — please sign in again."); }
      if(res.status === 400 && !IS_CONFIGURED.apiKey){ throw new ApiError("NO_KEY", "No YouTube API key configured yet."); }
      throw new ApiError("HTTP_"+res.status, (body && body.error && body.error.message) || ("Request failed ("+res.status+")"));
    }
    return res.json();
  },

  search(query, opts={}){
    return this.ytFetch("/search", Object.assign({
      part: "snippet", type:"video", maxResults: 24, q: query,
      safeSearch: Store.settings.restrictedMode ? "strict" : "none",
      regionCode: Store.settings.region
    }, opts));
  },

  popular(categoryId, opts={}){
    return this.ytFetch("/videos", Object.assign({
      part:"snippet,statistics,contentDetails", chart:"mostPopular",
      maxResults: 24, regionCode: Store.settings.region, videoCategoryId: categoryId || undefined
    }, opts));
  },

  videosByIds(ids){
    if(!ids.length) return Promise.resolve({items:[]});
    return this.ytFetch("/videos", { part:"snippet,statistics,contentDetails", id: ids.join(",") });
  },

  channelsByIds(ids){
    if(!ids.length) return Promise.resolve({items:[]});
    return this.ytFetch("/channels", { part:"snippet,statistics", id: ids.join(",") });
  },

  commentThreads(videoId, opts={}){
    return this.ytFetch("/commentThreads", Object.assign({
      part:"snippet", videoId, maxResults:30, order:"relevance", textFormat:"plainText"
    }, opts));
  },

  myChannel(){
    return this.ytFetch("/channels", { part:"snippet,statistics,contentDetails", mine:true }, true);
  },
  mySubscriptions(opts={}){
    return this.ytFetch("/subscriptions", Object.assign({ part:"snippet", mine:true, maxResults:50, order:"alphabetical" }, opts), true);
  },
  myPlaylists(opts={}){
    return this.ytFetch("/playlists", Object.assign({ part:"snippet,contentDetails", mine:true, maxResults:50 }, opts), true);
  },
  playlistItems(playlistId, opts={}){
    return this.ytFetch("/playlistItems", Object.assign({ part:"snippet", playlistId, maxResults:50 }, opts), true);
  },
  likedVideos(opts={}){
    return this.ytFetch("/videos", Object.assign({ part:"snippet,statistics,contentDetails", myRating:"like", maxResults:50 }, opts), true);
  },

  /* ---- OAuth (Google Identity Services token client) ---- */
  initGis(){
    if(this.gisReady || !IS_CONFIGURED.oauth || !window.google || !google.accounts) return;
    this.tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CONFIG.GOOGLE_CLIENT_ID,
      scope: CONFIG.OAUTH_SCOPES,
      callback: async (resp) => {
        if(resp.error){ toast("Sign-in failed: " + resp.error); return; }
        Store.auth = {
          access_token: resp.access_token,
          expiresAt: Date.now() + ((resp.expires_in||3600)*1000) - 30000
        };
        Store.saveAuth();
        try{
          const me = await Api.myChannel();
          const ch = me.items && me.items[0];
          if(ch){
            Store.auth.profile = {
              name: ch.snippet.title,
              thumb: ch.snippet.thumbnails && (ch.snippet.thumbnails.default||{}).url,
              channelId: ch.id
            };
            Store.saveAuth();
          }
        }catch(e){ /* non-fatal */ }
        toast("Signed in — subscriptions & playlists synced");
        rerenderChrome();
        navigate(currentRoute()); // refresh current view with signed-in data
      }
    });
    this.gisReady = true;
  },
  signIn(){
    if(!IS_CONFIGURED.oauth){ toast("Add a Google OAuth Client ID in Settings → Setup first."); openSettings("setup"); return; }
    this.initGis();
    if(!this.tokenClient){ toast("Google sign-in is still loading — try again in a moment."); return; }
    this.tokenClient.requestAccessToken({ prompt: Store.isSignedIn() ? "" : "consent" });
  },
  signOut(){
    const token = Store.auth && Store.auth.access_token;
    Store.signOut();
    if(token && window.google && google.accounts && google.accounts.oauth2){
      try{ google.accounts.oauth2.revoke(token, ()=>{}); }catch(e){}
    }
    toast("Signed out");
    rerenderChrome();
    navigate("home");
  }
};

class ApiError extends Error{
  constructor(code, message){ super(message); this.code = code; }
}

/* ---------------------------------------------------------------------
   4. UTIL
   --------------------------------------------------------------------- */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtCount(n){
  n = Number(n)||0;
  if(n >= 1e9) return (n/1e9).toFixed(1).replace(/\.0$/,"")+"B";
  if(n >= 1e6) return (n/1e6).toFixed(1).replace(/\.0$/,"")+"M";
  if(n >= 1e3) return (n/1e3).toFixed(1).replace(/\.0$/,"")+"K";
  return String(n);
}
function fmtAgo(ts){
  const s = Math.floor((Date.now() - ts)/1000);
  if(s < 60) return "just now";
  const m = Math.floor(s/60); if(m<60) return m+"m ago";
  const h = Math.floor(m/60); if(h<24) return h+"h ago";
  const d = Math.floor(h/24); if(d<30) return d+"d ago";
  const mo = Math.floor(d/30); if(mo<12) return mo+"mo ago";
  return Math.floor(mo/12)+"y ago";
}
function fmtDateAgo(iso){ return fmtAgo(new Date(iso).getTime()); }
function parseISODuration(iso){
  if(!iso) return 0;
  const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  if(!m) return 0;
  const h = parseInt(m[1]||0,10), mi = parseInt(m[2]||0,10), s = parseInt(m[3]||0,10);
  return h*3600 + mi*60 + s;
}
function fmtDuration(totalSec){
  if(!totalSec) return "";
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = Math.floor(totalSec%60);
  if(h>0) return h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  return m+":"+String(s).padStart(2,"0");
}
function thumbOf(snippet){
  const t = snippet && snippet.thumbnails;
  if(!t) return "";
  return (t.high||t.medium||t.default||{}).url || "";
}
function isShort(durSec, title){
  return durSec > 0 && durSec <= 61;
}
function debounce(fn, ms){
  let t; return (...a) => { clearTimeout(t); t = setTimeout(()=>fn(...a), ms); };
}
function h(tag, attrs, children){
  // tiny helper used sparingly; most views build via template strings for readability
  const el = document.createElement(tag);
  Object.entries(attrs||{}).forEach(([k,v])=>{
    if(k==="class") el.className = v; else if(k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k,v);
  });
  (children||[]).forEach(c => el.appendChild(typeof c==="string"?document.createTextNode(c):c));
  return el;
}
function toast(msg, ms=3200){
  let stack = document.getElementById("toastStack");
  if(!stack){
    stack = document.createElement("div"); stack.id = "toastStack"; stack.className="toast-stack";
    document.body.appendChild(stack);
  }
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  stack.appendChild(el);
  setTimeout(()=>{ el.remove(); }, ms);
}
function tallyTag(kind, label){
  // kind: 'live' (real API data) | 'local' (on-device only)
  return `<span class="tally-tag is-${kind}"><span class="dot"></span>${esc(label)}</span>`;
}
function skeletonGrid(n){
  let out = '<div class="grid">';
  for(let i=0;i<n;i++){
    out += `<div><div class="skel" style="aspect-ratio:16/9;border-radius:10px;"></div>
      <div class="card-body"><div class="skel" style="width:36px;height:36px;border-radius:50%;"></div>
      <div style="flex:1"><div class="skel" style="height:14px;width:90%;margin-bottom:8px;border-radius:4px;"></div>
      <div class="skel" style="height:12px;width:60%;border-radius:4px;"></div></div></div></div>`;
  }
  return out + "</div>";
}
const CATEGORY_CHIPS = [
  {id:"", label:"All"},
  {id:"28", label:"Tech"},
  {id:"10", label:"Music"},
  {id:"20", label:"Gaming"},
  {id:"17", label:"Sports"},
  {id:"25", label:"News"},
  {id:"24", label:"Entertainment"},
  {id:"27", label:"Education"},
  {id:"22", label:"Vlogs"},
  {id:"26", label:"How-to"}
];
const ACCENTS = ["#F2A93B","#3FC1C9","#E5484D","#8A6CF2","#4FBF6B","#EF6FA7"];

/* ---------------------------------------------------------------------
   5. ROUTER / RENDER
   Hash-based client-side routing only — GitHub Pages friendly, no
   server rewrites needed. Routes:
     #/home  #/search?q=  #/watch?v=  #/shorts?v=  #/subscriptions
     #/playlists  #/playlist?id=  #/history  #/you
   --------------------------------------------------------------------- */
const App = document.getElementById("app");
let SETTINGS_OPEN = false;
let SETTINGS_TAB = "playback";

function currentRoute(){ return location.hash.replace(/^#\/?/, "") || "home"; }
function routeParts(){
  const raw = currentRoute();
  const [path, qs] = raw.split("?");
  const params = new URLSearchParams(qs||"");
  return { path: path||"home", params };
}
function go(path){ location.hash = "#/" + path; }
function navLink(path, extra){ return "#/" + path + (extra?("?"+extra):""); }

window.addEventListener("hashchange", () => navigate(currentRoute()));

async function navigate(){
  const { path, params } = routeParts();
  window.scrollTo({top:0, behavior:"instant" in window ? "instant":"auto"});
  renderChrome(path);
  const main = document.getElementById("mainView");
  try{
    if(path === "home") await ViewHome(main);
    else if(path === "search") await ViewSearch(main, params.get("q")||"");
    else if(path === "watch") await ViewWatch(main, params.get("v"));
    else if(path === "shorts") await ViewShorts(main, params.get("v"));
    else if(path === "subscriptions") await ViewSubscriptions(main);
    else if(path === "playlists") await ViewPlaylists(main);
    else if(path === "playlist") await ViewPlaylistDetail(main, params.get("id"));
    else if(path === "history") await ViewHistory(main);
    else if(path === "you") await ViewYou(main);
    else await ViewHome(main);
  }catch(err){
    console.error(err);
    main.innerHTML = renderErrorState(err);
  }
  setupTvFocusables();
}

function renderErrorState(err){
  if(err instanceof ApiError){
    if(err.code === "NO_KEY"){
      return `<div class="empty-state"><div class="empty-icon">🔑</div><h3>No API key yet</h3>
        <p>Add a YouTube Data API v3 key to load real video data. Open Settings → Setup &amp; API Keys for step-by-step instructions.</p>
        <button class="signin-btn" onclick="openSettings('setup')" style="margin-top:18px;">Open setup</button></div>`;
    }
    if(err.code === "QUOTA"){
      return `<div class="empty-state"><div class="empty-icon">⏳</div><h3>Daily quota used up</h3><p>${esc(err.message)}</p></div>`;
    }
    if(err.code === "AUTH"){
      return `<div class="empty-state"><div class="empty-icon">🔒</div><h3>Session expired</h3><p>${esc(err.message)}</p>
        <button class="signin-btn" onclick="Api.signIn()" style="margin-top:18px;">Sign in again</button></div>`;
    }
  }
  return `<div class="empty-state"><div class="empty-icon">⚠️</div><h3>Something went wrong</h3><p>${esc(err.message||String(err))}</p></div>`;
}

/* ---- HOME: algorithmic-styled grid, seeded by category chips + local history signal ---- */
let homeChip = "";
async function ViewHome(main){
  main.innerHTML = `
    <div class="view-header">
      <div>
        <div class="view-title">${tallyTag("live","recommended")} For you</div>
        <div class="view-sub">Trending across your region, weighted toward what you've watched here.</div>
      </div>
    </div>
    <div class="chip-row" id="chipRow" role="tablist" aria-label="Categories">
      ${CATEGORY_CHIPS.map(c => `<button class="chip tv-focusable" role="tab" aria-pressed="${c.id===homeChip}" onclick="setHomeChip('${c.id}')">${esc(c.label)}</button>`).join("")}
    </div>
    <div id="homeBody">${skeletonGrid(12)}</div>
  `;
  await loadHomeBody();
}
window.setHomeChip = function(id){
  homeChip = id;
  document.querySelectorAll("#chipRow .chip").forEach((el,i)=> el.setAttribute("aria-pressed", CATEGORY_CHIPS[i].id===id));
  loadHomeBody();
};
async function loadHomeBody(){
  const body = document.getElementById("homeBody");
  if(!body) return;
  body.innerHTML = skeletonGrid(12);
  try{
    const resp = await Api.popular(homeChip);
    let items = resp.items || [];
    items = rankByLocalAffinity(items);
    if(!items.length){
      body.innerHTML = emptyBlock("📡","Nothing here yet","Try a different category, or check your API key in Settings → Setup.");
      return;
    }
    let out = "";
    if(Store.settings.showShorts){
      const shorts = items.filter(v => parseISODuration(v.contentDetails.duration) <= 61).slice(0,10);
      if(shorts.length){
        out += `<div class="section-block"><div class="section-head"><h2>${ICON.play} Shorts</h2>
          <button class="chip tv-focusable" onclick="go('shorts?v=${shorts[0].id}')">Open Shorts</button></div>
          <div class="shorts-rail">${shorts.map(shortCardHtml).join("")}</div></div>`;
      }
    }
    const longform = items.filter(v => parseISODuration(v.contentDetails.duration) > 61);
    out += `<div class="grid">${longform.map(v=>videoCardHtml(v)).join("")}</div>`;
    body.innerHTML = out;
  }catch(err){
    body.innerHTML = renderErrorState(err);
  }
}
function rankByLocalAffinity(items){
  // Lightweight local "algorithm": boost items whose channel matches
  // channels the user has watched before (from local history), so the
  // grid visibly responds to in-app activity without needing a server.
  const watchedChannels = new Set(Store.history.map(h=>h.channelId).filter(Boolean));
  return items.slice().sort((a,b)=>{
    const aBoost = watchedChannels.has(a.snippet.channelId) ? 1 : 0;
    const bBoost = watchedChannels.has(b.snippet.channelId) ? 1 : 0;
    if(aBoost !== bBoost) return bBoost - aBoost;
    return (Number(b.statistics && b.statistics.viewCount)||0) - (Number(a.statistics && a.statistics.viewCount)||0);
  });
}

function videoCardHtml(v){
  const id = v.id && v.id.videoId ? v.id.videoId : v.id;
  const sn = v.snippet;

      <div>
        <div class="card-title">${esc(sn.title)}</div>

      </div>
    </div>
  </button>`;
}
function shortCardHtml(v){

async function ViewSearch(main, query){
  main.innerHTML = `
    <div class="view-header">
      <div><div class="view-title">Search results</div><div class="view-sub">${query ? `for “${esc(query)}”` : "Type something in the search bar above"}</div></div>
    </div>
    <div id="searchBody">${query ? skeletonGrid(12) : emptyBlock("🔍","Search Signal","Find videos across YouTube — no ads, no clutter.")}</div>
  `;
  if(!query) return;
  const body = document.getElementById("searchBody");
  try{
    const resp = await Api.search(query);
    const items = resp.items || [];
    if(!items.length){ body.innerHTML = emptyBlock("🔍","No results", `Nothing matched "${esc(query)}". Try different words.`); return; }
    const ids = items.map(i=>i.id.videoId).filter(Boolean);
    const detail = await Api.videosByIds(ids);
    const byId = {}; (detail.items||[]).forEach(d=> byId[d.id]=d);
    const merged = items.map(i => {
      const d = byId[i.id.videoId];
      return d ? d : i;
    });
    body.innerHTML = `<div class="grid">${merged.map(v=>videoCardHtml(v)).join("")}</div>`;
  }catch(err){ body.innerHTML = renderErrorState(err); }
}

let currentWatchId = null;
async function ViewWatch(main, videoId){
  if(!videoId){ main.innerHTML = emptyBlock("🎬","No video selected","Pick something from the home grid or search."); return; }
  currentWatchId = videoId;
  main.innerHTML = `
    <div class="watch-layout">
      <div>
        <div class="player-wrap" id="playerWrap">${playerEmbedHtml(videoId)}</div>
        <div id="watchInfo"><div class="loading-row"><div class="spinner"></div>Loading video…</div></div>
        <div id="commentsBlock"></div>
      </div>
      <aside>
        <div class="section-head"><h2>Up next</h2></div>
        <div class="sidebar-list" id="upNext">${Array(4).fill('<div class="skel" style="aspect-ratio:16/9;"></div>').join("")}</div>
      </aside>
    </div>
  `;
  try{
    const [detail, related] = await Promise.all([
      Api.videosByIds([videoId]),
      Api.search((await getSeedTitle(videoId)) || "trending", {})
    ]);
    const v = detail.items && detail.items[0];
    if(!v){ document.getElementById("watchInfo").innerHTML = emptyBlock("🚫","Video unavailable","This video may be private, deleted, or region-blocked."); return; }
    renderWatchInfo(v);
    logToHistory(v);
    renderUpNext((related.items||[]).filter(r => r.id.videoId !== videoId));
    loadComments(videoId);
  }catch(err){
    document.getElementById("watchInfo").innerHTML = renderErrorState(err);
  }
}
async function getSeedTitle(videoId){
  try{
    const d = await Api.videosByIds([videoId]);
    return d.items && d.items[0] && d.items[0].snippet.title.split(" ").slice(0,4).join(" ");
  }catch(e){ return null; }
}
function playerEmbedHtml(videoId, autoplayOverride){
  const autoplay = (autoplayOverride!=null ? autoplayOverride : Store.settings.autoplay) ? 1 : 0;
  // "modestbranding/rel=0/iv_load_policy=3" = the cleanest official embed
  // surface YouTube exposes; this is the ad_shield "embed" mode.
  const cc = Store.settings.playerCaptions ? 1 : 0;
  const src = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(videoId)}?autoplay=${autoplay}&rel=0&modestbranding=1&iv_load_policy=3&playsinline=1&cc_load_policy=${cc}&color=white`;
  return `<iframe src="${src}" title="Video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
}
function renderWatchInfo(v){
  const sn = v.snippet, stats = v.statistics||{};
  const reaction = Store.reactions[v.id];
  Store.bumpLocalDislike(v.id);
  const dislikeCount = Store.localDislikes[v.id] + (reaction==="dislike"?1:0);
  const likeCount = Number(stats.likeCount||0) + (reaction==="like"?1:0);
  const desc = sn.description || "No description provided.";
  document.getElementById("watchInfo").innerHTML = `
    <h1 class="watch-title">${esc(sn.title)}</h1>
    <div class="watch-meta-row">
      <div class="watch-stats">
        <span>${fmtCount(stats.viewCount)} views</span>
        <span>•</span>
        <span>${sn.publishedAt ? fmtDateAgo(sn.publishedAt) : ""}</span>
        ${tallyTag("live","live stats")}
      </div>
      <div class="engage-row">
        <div class="pill-group">
          <button class="${reaction==='like'?'active':''}" onclick="toggleReaction('${v.id}','like')">${ICON.thumbUp} ${fmtCount(likeCount)}</button>
          <button class="dislike ${reaction==='dislike'?'active':''}" onclick="toggleReaction('${v.id}','dislike')">${ICON.thumbDown} ${fmtCount(dislikeCount)}</button>
        </div>
        <button class="pill-btn-plain tv-focusable" onclick="shareVideo('${v.id}')">${ICON.share} Share</button>
        <button class="pill-btn-plain tv-focusable" onclick="toast('Saved locally — playlist saving coming from your account is read-only in this build')">${ICON.save} Save</button>
      </div>
    </div>
    <div class="tally-tag is-local" style="margin-bottom:16px;"><span class="dot"></span>dislikes are a local-only estimate — YouTube stopped showing public dislike counts in 2021</div>
    <div class="channel-row">
      <img src="${esc(thumbOf(sn))}" alt="">
      <div><div class="ch-name">${esc(sn.channelTitle)}</div><div class="ch-subs">${tallyTag(Store.isSignedIn()?"live":"local", Store.isSignedIn()?"synced":"sign in to subscribe")}</div></div>

}
window.toggleReaction = function(videoId, type){

async function loadComments(videoId){
  const el = document.getElementById("commentsBlock");

/* ---- SHORTS ---- */
async function ViewShorts(main, seedId){
  main.innerHTML = `<div class="loading-row" style="height:60vh;"><div class="spinner"></div>Loading shorts…</div>`;
  try{
    const resp = await Api.popular("");
    let items = (resp.items||[]).filter(v => parseISODuration(v.contentDetails.duration) <= 61);
    if(!items.length) items = (resp.items||[]).slice(0,8); // fallback if region has few tagged shorts
    if(seedId && !items.find(v=>v.id===seedId)){
      try{ const d = await Api.videosByIds([seedId]); if(d.items&&d.items[0]) items.unshift(d.items[0]); }catch(e){}
    }
    main.innerHTML = `
      <div class="shorts-viewer" id="shortsViewer">
        ${items.map(v => `
          <div class="shorts-stage" data-id="${v.id}">
            <iframe data-src="https://www.youtube-nocookie.com/embed/${v.id}?autoplay=0&rel=0&modestbranding=1&playsinline=1&loop=1&playlist=${v.id}" title="${esc(v.snippet.title)}" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>
            <div class="shorts-side-actions">
              <button class="tv-focusable" onclick="toggleReaction('${v.id}','like');toast('Liked')" aria-label="Like">${ICON.thumbUp}</button>
              <button class="tv-focusable" onclick="toggleReaction('${v.id}','dislike')" aria-label="Dislike">${ICON.thumbDown}</button>
              <button class="tv-focusable" onclick="shareVideo('${v.id}')" aria-label="Share">${ICON.share}</button>
            </div>
          </div>
        `).join("")}
      </div>
      <div class="shorts-nav-hint">Scroll or use ↑ / ↓ to move between shorts</div>
    `;
    setupShortsObserver();
  }catch(err){ main.innerHTML = renderErrorState(err); }
}
function setupShortsObserver(){
  const stages = Array.from(document.querySelectorAll(".shorts-stage"));
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(entry => {
      const iframe = entry.target.querySelector("iframe");
      if(entry.isIntersecting && entry.intersectionRatio > 0.7){
        if(!iframe.src) iframe.src = iframe.dataset.src.replace("autoplay=0", "autoplay="+(Store.settings.autoplay?1:0));
        logShortToHistory(entry.target.dataset.id);
      } else {
        if(iframe.src) { iframe.src = ""; } // pause offscreen shorts by unloading
      }
    });
  }, { threshold: [0, 0.7, 1] });
  stages.forEach(s => io.observe(s));
}

    ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")

  root.setAttribute("data-theme", resolvedTheme);

/* ---------------------------------------------------------------------
   7. TV / KEYBOARD NAV
   Arrow-key spatial navigation across .tv-focusable elements, plus
   Space to play/pause the active player and Enter to activate.
   Active in both layouts (arrow nav is broadly useful), but the
   persistent hint bar + larger targets only show in TV layout.
   --------------------------------------------------------------------- */
let tvFocusables = [];
let tvFocusIndex = 0;

function setupTvFocusables(){
  tvFocusables = Array.from(document.querySelectorAll(".tv-focusable"))
    .filter(el => el.offsetParent !== null);
  tvFocusIndex = Math.min(tvFocusIndex, Math.max(0, tvFocusables.length-1));
}

function spatialNav(dir){
  if(!tvFocusables.length) return;
  const active = document.activeElement;
  const curRect = tvFocusables.includes(active) ? active.getBoundingClientRect() : null;
  if(!curRect){ tvFocusables[0].focus(); return; }
  const cx = curRect.left + curRect.width/2, cy = curRect.top + curRect.height/2;
  let best = null, bestScore = Infinity;
  tvFocusables.forEach(el => {
    if(el === active) return;
    const r = el.getBoundingClientRect();
    const ex = r.left + r.width/2, ey = r.top + r.height/2;
    const dx = ex - cx, dy = ey - cy;
    let primary, ok;
    if(dir==="right"){ primary = dx; ok = dx > 4 && Math.abs(dy) < curRect.height*3; }
    else if(dir==="left"){ primary = -dx; ok = dx < -4 && Math.abs(dy) < curRect.height*3; }
    else if(dir==="down"){ primary = dy; ok = dy > 4; }
    else { primary = -dy; ok = dy < -4; }
    if(!ok) return;
    const score = primary + Math.abs(dir==="left"||dir==="right" ? dy : dx) * 1.4;
    if(score < bestScore){ bestScore = score; best = el; }
  });
  if(best){ best.focus(); best.scrollIntoView({block:"nearest", inline:"nearest", behavior: Store.settings.reduceMotion?"auto":"smooth"}); }
}

document.addEventListener("keydown", (e) => {
  if(SETTINGS_OPEN && e.key !== "Escape") return; // let settings panel own keys except Esc
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  const typing = tag === "INPUT" || tag === "TEXTAREA";

  if(e.key === "s" && !typing && !e.metaKey && !e.ctrlKey){ openSettings(); return; }
  if(e.key === "Escape"){
    if(SETTINGS_OPEN){ closeSettings(); return; }
    if(currentRoute() !== "home"){ go("home"); return; }
  }
  if(typing) return;

  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)){
    e.preventDefault();
    setupTvFocusables();
    spatialNav({ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"}[e.key]);
  } else if(e.key === " "){
    const path = routeParts().path;
    if(path === "watch" || path === "shorts"){
      e.preventDefault();
      togglePlayPause();
    }
  } else if(e.key === "Enter"){
    if(document.activeElement && document.activeElement.click) document.activeElement.click();
  }
});

function togglePlayPause(){
  // postMessage control against the active YouTube iframe (works for
  // both youtube-nocookie.com embed and standard embed).
  const iframe = document.querySelector(".player-wrap iframe, .shorts-stage:hover iframe, .shorts-stage iframe");
  if(!iframe) return;
  try{
    iframe.contentWindow.postMessage(JSON.stringify({event:"listening", id: 1}), "*");
    // Toggle: send playVideo, if already playing YT will just continue; we track a data flag to alternate.
    const playing = iframe.dataset.playing !== "false";
    iframe.contentWindow.postMessage(JSON.stringify({event:"command", func: playing ? "pauseVideo" : "playVideo", args:[]}), "*");
    iframe.dataset.playing = playing ? "false" : "true";
  }catch(e){ /* cross-origin postMessage best-effort only */ }
}

/* ---------------------------------------------------------------------
   8. INIT
   --------------------------------------------------------------------- */
function boot(){
  applySettingsToDOM();
  if(window.matchMedia){
    window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => {
      if(Store.settings.theme === "system") applySettingsToDOM();
    });
  }
  if(!location.hash) location.hash = "#/home";
  navigate();

  // Kick off GIS init once the script tag loads (it's async/defer).
  const gisPoll = setInterval(() => {
    if(window.google && google.accounts && google.accounts.oauth2){
      Api.initGis();
      clearInterval(gisPoll);
    }
  }, 200);
  setTimeout(()=>clearInterval(gisPoll), 15000);
}

if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}

// expose a few things on window for inline handlers
window.go = go; window.Store = Store; window.Api = Api; window.renderSettingsTabBody = renderSettingsTabBody;

})();
</script>
